<section class="about section-wrap" id="about" aria-labelledby="about-title">
  <div class="section-heading">
    <p class="section-kicker">About me</p>
    <h2 id="about-title">Augmented reality.<br /><em>Computer vision.</em></h2>
  </div>
  <div class="about__content">
    <p class="about__copy">{{ portfolio().introduction }}</p>
  </div>
  <div class="section-heading section-heading--wide">
    <div>
      <p class="section-kicker">From computer vision to LLM-powered applications</p>
      <h2 id="focus-title">What I work on</h2>
    </div>
  </div>
  <ul class="focus__grid" id="focus" aria-labelledby="focus-title">
    @for (area of focusAreas(); track area.title) {
      <li class="focus-card">
        <span class="focus-card__number">0{{ $index + 1 }}</span>
        <h3>{{ area.title }}</h3>
        <p>{{ area.description }}</p>
      </li>
    }
  </ul>
</section>
