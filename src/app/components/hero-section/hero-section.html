<section class="hero" id="top" aria-labelledby="hero-title">
  <img class="hero__backdrop" [src]="portfolio().backdrop" alt="" />
  <div class="hero__copy">
    <p class="eyebrow">{{ portfolio().role }}</p>
    <h1 id="hero-title">{{ portfolio().name }}</h1>
    <p class="hero__position">{{ portfolio().currentPosition }}</p>
    <p class="hero__location">{{ portfolio().location }}</p>
    <div class="hero__actions">
      <a class="button button--solid" [href]="portfolio().cv" download>Download CV</a>
      <a
        class="button button--quiet"
        [href]="portfolio().linkedin"
        target="_blank"
        rel="noreferrer"
      >
        <svg class="button__icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM3.56 9h3.554v11.452H3.56z"
          />
        </svg>
        LinkedIn
      </a>
      <a class="button button--quiet" [href]="'mailto:' + portfolio().email">
        <svg
          class="button__icon button__icon--email"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="3" y="5" width="18" height="14" rx="1" />
          <path d="m4 7 8 6 8-6" />
        </svg>
        Email
      </a>
    </div>
  </div>
  <figure class="hero__portrait">
    <img [src]="portfolio().portrait" [alt]="portfolio().name + ', ' + portfolio().role" />
  </figure>
</section>
