<section class="contact section-wrap" id="contact" aria-labelledby="contact-title">
  <div>
    <p class="section-kicker">Contact</p>
    <h2 id="contact-title">Get in touch</h2>
    <p class="contact__prompt">{{ portfolio().contactPrompt }}</p>
  </div>
  <div class="contact__details">
    <a class="button button--quiet contact__email" [href]="'mailto:' + portfolio().email">
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <rect x="3" y="5" width="18" height="14" rx="1" />
        <path d="m4 7 8 6 8-6" />
      </svg>
      Email
    </a>
    <a class="contact__linkedin" [href]="portfolio().linkedin" target="_blank" rel="noreferrer">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM3.56 9h3.554v11.452H3.56z"
        />
      </svg>
      LinkedIn
    </a>
  </div>
</section>
